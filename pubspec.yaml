name: awios
description: AwiOS - Visual Novel Engine. Data-driven stories inside a fictional phone OS (iOS style).
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  encrypt: ^5.0.3
  flutter_riverpod: ^3.2.1
  shared_preferences: ^2.2.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2
  video_player_win: ^3.2.2
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/scripts/
    - assets/images/
    - assets/videos/
